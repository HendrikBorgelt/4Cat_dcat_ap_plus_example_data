---
id: coremeta4cat:REAC_arp5-s69r_Carbonylation
reaction_name:
- Pd-catalyzed alkoxycarbonylation of aryl iodides
title:
- Alkoxycarbonylation of aryl iodides over Pd3P/SiO2 and Pd/SiO2 (27 runs)
description:
- Pd-catalyzed alkoxycarbonylation (CO insertion + alcohol trapping) of aryl iodides to form aryl esters,
  mainly iodobenzene + ethanol -> ethyl benzoate. 24 runs used Pd3P/SiO2 (ARNE01), exploring reaction
  time (5 min - 3 h, series A), base screening (triethylamine, sodium acetate, potassium hydroxide, potassium
  carbonate, or no base, series B), temperature-time kinetics grid (60-80 C x 0.5-1 h, series k), and
  substrate/nucleophile scope (methanol, isopropanol, and aryl iodide substrates bromoiodobenzene/iodotoluene/iodoanisole,
  series S1-S5). 3 further runs (series C) repeated the time-course on Pd/SiO2 (ARNE02, P-free reference)
  for comparison. Conversion/yield ranged 7-100% across all 27 runs. Batch reactor, CO 6 bar, ethanol
  solvent (except S1 methanol, S2 isopropanol).
