# CatalyticReaction -- CO2 methanation, catalyst screening series
# Source: hdl:21.11165/4cat/2d6m-exeb, runs Exp7, Exp8, Exp9, Exp13, Exp14,
# Exp15, Exp16, Exp17 (feed contains CO2, no CO)

id: "coremeta4cat:REAC_2d6m-exeb_CO2_methanation"
reaction_name:
  - "CO2 methanation"
title:
  - "CO2 methanation catalyst screening (8 Ni catalysts)"
description:
  - >-
    Catalytic CO2 methanation (CO2 + 4H2 -> CH4 + 2H2O) screened over 8
    supported Ni catalysts (Al2O3, SiO2, ZrO2, MgAl2O4 supports; 10-40.8 wt%
    Ni) in cylindrical isothermal fixed-bed reactors (radius 3-10 mm across
    runs). Steady-state CO2 conversion measured as a function of superficial
    velocity and temperature. Source runs: Exp7, Exp8, Exp9, Exp13, Exp14,
    Exp15, Exp16, Exp17 (Ni/Al2O3 x4, Ni/MgAl2O4 x2, Ni/ZrO2, Ni/SiO2). Total
    pressure ~100-101.3 kPa in all runs except Exp9 (800 kPa, an outlier
    within this series).
rdf_type:
  id: VOC4CAT:0007011
  title: "CO2 methanation"
catalyst_type:
  - heterogeneous_catalysis
catalyst_form:
  - supported
