id: coremeta4cat:REAC_32x1-99x6_CAL_SiO2
reaction_name:
- selective hydrogenation of cinnamyl alcohol
title:
- Selective hydrogenation of cinnamyl alcohol over Pd-P/SiO2 catalysts
description:
- Selective hydrogenation of cinnamyl alcohol (CAL) over 4 Pd/P/SiO2 catalysts (P loading 0-5 wt%, ~2
  wt% Pd) in a full factorial design (9 runs) exploring temperature, pressure, phosphorus loading, and
  time. An initial fixed-condition screening (50C/5bar/30min, hot-filtration leaching test) gave CAL conversion/HCAL
  yield of 23/22% (Pd/SiO2) and 78/40% (Pd/3P/SiO2). Conversion ranged 12-100%, yield 9-56% across the
  9-run design (catalytic_data.xlsx, 'Pd-XPSiO2_FF_CAL').
