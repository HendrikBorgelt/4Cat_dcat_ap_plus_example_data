  id: "coremeta4cat:SYN_b74m-m6rp_IWI_method"
  title: "stepwise incipient wetness impregnation, calcination, granulation"
  description: >-
    Because of the low pore volume of the cermets the precursor solution was added in 100 uL
    steps, each followed by drying at 348 K for 15 min, until the target loading was reached.
    Nitrates decomposed by calcination for 5 h at 873 K in static air; granulated to
    120-250 um.
