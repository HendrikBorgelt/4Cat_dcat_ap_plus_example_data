id: "coremeta4cat:REAC_b74m-m6rp_NH3_decomposition"
reaction_name:
  - "thermocatalytic ammonia decomposition"
title:
  - "NH3 decomposition light-off over Ru/Ni-BCZY and reference catalysts (6 catalysts, 3 inlet concentrations)"
description:
  - >-
    Thermocatalytic decomposition of ammonia (2 NH3 -> N2 + 3 H2) measured as light-off curves:
    outlet NH3 concentration and NH3 conversion against inlet temperature, 200-600 C, for six
    catalysts at 1000 ppm NH3 (Fig. 2). For 0.5Ru-1Ba/Ni-BCZY and Ni-BCZY the inlet
    concentration was also varied (500, 1000, 3000 ppm; Fig. 3 and Fig. 6-8). Conversion reaches
    99.8-100% at 600 C for the five catalysts whose files are readable. Motivation stated in the
    title: Ba-promoted Ru/Ni-BCZY
    as anode-side catalyst for ammonia-fed protonic ceramic cells; the measurements themselves
    are thermocatalytic. Loadings are encoded in the sample names (e.g. 0.5Ru-1Ba); their unit
    is not stated.
