id: "coremeta4cat:SIM_b74m-m6rp_MKM_validation"
title:
  - "Microkinetic simulation of NH3 decomposition light-off on Ni-BCZY and 0.5Ru-1Ba/Ni-BCZY"
description:
  - >-
    One-dimensional reactor simulation with a microkinetic surface mechanism on Ru and Ni sites,
    compared with the measured light-off curves at 500, 1000 and 3000 ppm NH3 (Fig. 6-8). For
    Ni-BCZY both the original and an optimized mechanism were run; for 0.5Ru-1Ba/Ni-BCZY the
    original (Fig. 6) and the optimized mechanism (Fig. 8). Simulated surface temperature
    498-848 K. Surface species of the mechanism, from the profile files: Ru, H-Ru, N-Ru, NH-Ru,
    NH2-Ru, NH3-Ru, Ni, H-Ni, N-Ni, NH-Ni, NH2-Ni, NH3-Ni.
