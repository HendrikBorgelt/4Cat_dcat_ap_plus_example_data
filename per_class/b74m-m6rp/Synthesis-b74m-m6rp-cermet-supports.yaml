realized_plan:
  id: "coremeta4cat:SYN_b74m-m6rp_tape_casting_method"
  title: "tape casting, sintering and crushing"
  description: >-
    Ceramic powder (and NiO for the cermets) slurried with graphite, ethanol and MEK in a
    TURBULA 3D shaker for 24 h; PVB, PEG and TEG-EH added, mixed 3 h, rested 24 h, de-aired
    under vacuum; cast with a ZAA 2300 film applicator onto silicone-coated PET; dried 12 h at
    room temperature and 10 min at 773 K; sintered 9 h at 1673 K (heating 1 K/min, cooling
    3 K/min); crushed to a fine powder.
