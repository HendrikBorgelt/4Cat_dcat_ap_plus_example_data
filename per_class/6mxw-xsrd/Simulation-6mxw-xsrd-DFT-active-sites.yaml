  - id: "coremeta4cat:SLAB_6mxw-xsrd_Ga2O3_sites"
    title: "Ga2O3 surface models, pristine and with 8 dopants"
    description: "Dopants Al, Pd, Pt, Rh, Ru, Sn, Zn, Zr. Facet, polymorph and slab model are in the article's SI."
