# Simulation -- DFT binding energies of OH and CO at doped CuGa2O4 and Ga2O3 sites
# Source: hdl:21.11165/4cat/6mxw-xsrd, Active_Sites_Screening.tab (17 sites x OH, CO);
# method from the authors' vocabulary_map.csv (active_site, OH, CO -> density functional theory);
# software and functional from Weber et al., ACS Catal. 2025, 15, 18857 (section 2.3)
#
# The article's main text describes the DFT setup in general terms. The settings for this
# particular table (cut-off, k-points, slab models, OH reference state) are in its Supporting
# Information, which is not part of this folder. The main text defines the CO adsorption energy
# (E_CO = E_slab+CO - E_slab - E_CO(g)) but not the OH reference
# (schema_gap_analysis_2026-10.md, S2).

id: "coremeta4cat:SIM_6mxw-xsrd_DFT_active_sites"
title:
  - "DFT binding energies of OH and CO at 17 oxide surface sites"
description:
  - >-
    Density functional theory binding energies of OH and CO at 17 sites: pristine CuGa2O4 and
    CuGa2O4 doped with Al, Co, Cu, Ge, In, Ni or Sn, and pristine Ga2O3 and Ga2O3 doped with Al,
    Pd, Pt, Rh, Ru, Sn, Zn or Zr. Site notation in the source file is <host>-<dopant>, e.g.
    CuGa2O4-Co. Part of the theory-based prediction that led to the Cu-Ga-Al system (article,
    section 3.1).
software_package:
  - "VASP"
  - "Atomic Simulation Environment (ASE), structure generation"
  - "pymatgen, structure generation"
