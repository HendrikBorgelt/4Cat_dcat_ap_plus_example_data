id: "coremeta4cat:CHAR_6mxw-xsrd_XRF"
title:
  - "XRF elemental analysis (76 Cu-Ga-Al hydrotalcite-like precursors)"
description:
  - >-
    X-ray fluorescence analysis of 76 Cu-Ga-Al compositions spanning the Cu/Al/Ga ternary
    (Cu 0-1, Al 0-1, Ga 0-1, metal fractions normalised to 1), including the three
    single-metal end members. According to the article (section 3.2), XRF was measured on the
    freeze-dried hydrotalcite-like (HTC) precursors, i.e. before calcination. Measured Cu, Al
    and Ga fractions are reported next to the nominal fractions.
