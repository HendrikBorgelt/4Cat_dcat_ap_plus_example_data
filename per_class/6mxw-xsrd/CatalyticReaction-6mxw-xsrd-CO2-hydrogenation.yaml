# Performance_Test_Composition_and_CalcTemp_firstgen.tab and ..._secondgen.csv (tested samples);
# reactor, pretreatment, N2 balance and the sample/condition assignment from Weber et al.,
# ACS Catal. 2025, 15, 18857 (section 2.2 and Table 1)
#
# Not stated: product_identification_method (recommended). Neither the deposit nor the main
# text of the article says how products were analysed; presumably it is in the SI.
# Schema gaps (schema_gap_analysis_2026-10.md): R1 no space-velocity slot; R2 no slots for the
# yields and conversions reported in the article; R4 catalyst amount given as a volume (0.5 mL)
# and the pretreatment/activation have no field; R3 no reaction-type term for CO2
# hydrogenation. FixedBedReactor fields are used on used_reactor, declared with
# reactor_designator (T1).

id: "coremeta4cat:REAC_6mxw-xsrd_CO2_hydrogenation"
reaction_name:
  - "hydrogenation of CO2/CO to methanol and dimethyl ether"
title:
  - "CO2/CO hydrogenation over optimized Cu-Ga-Al mixed metal oxides (17 conditions, 7 catalysts)"
description:
  - >-
    Gas-phase testing of the first-generation (Cu0.465Ga0.07Al0.465, calcined at 500, 600 and
    700 C) and second-generation (Cu0.85Al0.15 with 1 wt% Ga, two calcination steps) catalysts
    under all 17 conditions of the test protocol: 80 bar, 225-300 C, GHSV 3000 and 6000 h-1,
    CO2 13-27.1 vol%, CO 0-15.8 vol%, H2 36.7-76 vol%, 5 vol% Ar, balance N2 (0-26.7 vol%),
    H2/COx 1.2-4. Pretreatment: 2 h at 300 C and 20 bar under 10 vol% Ar in N2 (GHSV 6000 h-1,
    48 L/h), then in-situ reduction in the syngas feed. Products are methanol and dimethyl
    ether, with methane as a minor by-product. Conversions and yields are reported in the
    article's figures only; they are not deposited.
catalyst_type:
  - heterogeneous_catalysis
catalyst_form:
  - bulk
