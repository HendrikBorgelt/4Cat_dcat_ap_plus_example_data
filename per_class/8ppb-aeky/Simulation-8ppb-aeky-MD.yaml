---
# Simulation -- molecular dynamics of the substrate-cofactor complex in 3FCR-4M and two mutants
# Source: hdl:21.11165/4cat/8ppb-aeky, per complex: desmond_setup_* (32 MB),
# desmond_min_job_* (55 MB), desmond_md_job_* (1.1 GB, equilibration),
# desmond_md_job_*_prod (9.5 GB, production), not read; purpose, analysis and the M1/M2 mapping
# from Weigmann et al., ACS Catal. (2025), doi:10.1021/acscatal.5c04248
#
# No calculated_property: the result is a trajectory, not a property (recommended since
# 2026-11; S5). MolecularDynamics has force_field, ensemble_type,
# simulation_timestep, simulation_time and number_of_atoms, which fit this case; the article's
# main text gives none of them (system preparation and MD details are in its SI), and the
# archives were not read. Setup, minimisation, equilibration and production cannot be expressed
# as ordered stages of one simulation (P1/S6).

id: "coremeta4cat:SIM_8ppb-aeky_MD"
title:
  - "Molecular dynamics of the substrate-cofactor complex in 3FCR-4M, 4M-N15 and 4M-N16"
description:
  - >-
    Desmond molecular dynamics of the docked substrate-cofactor complex in 3FCR-4M and the
    mutants S19V/P423F (4M-N15, deposit M1) and G151A/P423F (4M-N16, deposit M2), run to
    investigate why these mutations change the kinetic parameters. Each variant has a system
    setup, a minimisation, an equilibration and a production run (12 archives, about 32 GB).
    The production runs extend beyond 100 ns; trajectories were analysed with the Simulation
    Interaction Diagram and in-house scripts using the Schrodinger Python API, and frames after
    100 ns were used for MM/GBSA.
software_package:
  - "Desmond (Schrodinger suite)"
  - "Simulation Interaction Diagram and Schrodinger Python API, analysis"
evaluated_entity:
  - id: "coremeta4cat:ENZ_8ppb-aeky_3FCR-4M_complex"
    title: "3FCR-4M with cofactor-bound substrate 2a"
  - id: "coremeta4cat:ENZ_8ppb-aeky_3FCR-4M-M1_complex"
    title: "4M-N15 = 3FCR-4M-S19V/P423F (deposit M1) with cofactor-bound substrate 2a"
  - id: "coremeta4cat:ENZ_8ppb-aeky_3FCR-4M-M2_complex"
    title: "4M-N16 = 3FCR-4M-G151A/P423F (deposit M2) with cofactor-bound substrate 2a"
realized_plan:
  id: "coremeta4cat:SIM_8ppb-aeky_MD_method"
  plan_designator: NCIT:C18097
  title: "molecular dynamics: setup, minimisation, equilibration, production"
  description: >-
    Force field, water model, ensemble, temperature, timestep and simulation length are in the
    article's SI and the Desmond configuration files inside the archives; neither was read.
other_identifier:
