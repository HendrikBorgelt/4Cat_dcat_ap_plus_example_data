title:
  - "Molecular dynamics of the transaminase ligand-cofactor complex in 3FCR-4M and two mutants"
description:
  - >-
    Desmond molecular dynamics of the docked ligand-cofactor complex in three variants:
    3FCR-4M, 3FCR-4M-S19V/P423F (M1) and 3FCR-4M-G151A/P423F (M2). Each variant has a system
    setup, a minimisation, an equilibration and a production run (12 archives, about 32 GB
    in total). The mutants M1 and M2 were among the variants studied in the publication on
    AI-guided transaminase engineering (README.md).
