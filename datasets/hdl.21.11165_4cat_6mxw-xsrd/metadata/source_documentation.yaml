# ============================================================
# 2. SYNTHESIS
# ============================================================

coprecipitation_route:
  value: "automated co-precipitation at pH 9 +- 0.1 with 1.6 M NaOH / 0.2 M Na2CO3, 1.6 mL/min feed into 200 mL water, 500 rpm, ageing 2 h at 65 C, washing to pH 7, freeze-drying (-10 C, 3 mbar, 12 h), calcination 4 h at 4 C/min in clean dry air"
  source: Article [2.1.1]

precursors:
  value: "Cu(NO3)2·3H2O (Sigma-Aldrich 98.8%), Al(NO3)3·9H2O (99.9%), Ga(NO3)3·xH2O (99.9%)"
  source: Article [2.1.1]

precursor_masses:
  value: "5.25 g Cu nitrate, 8.37 g Al nitrate, 8.92 g Ga nitrate in 150 mL water"
  source: Article [2.1.1]
  note: >-
    Given only for the worked example CuAlGaO4, hence one complete Synthesis record
    (Synthesis-6mxw-xsrd-library-example.yaml). Masses for the first- and second-generation
    catalysts are not stated; both records stay incomplete.

library_calcination:
  value: "400, 500, 600, 700 and 900 C; screening samples at 600 C"
  source: Article [2.1.1, 3.3]

gen1:
  value: "Cu0.465Ga0.07Al0.465, same co-precipitation route, calcined at 500/600/700 C"
  source: Performance_Test_Composition_and_CalcTemp_firstgen [all]; Article [3.4]

gen2:
  value: "Cu0.85Al0.15 HTC co-precipitated, calcined 450/550 C; incipient wetness impregnation with Ga(NO3)3 to 1 wt% Ga; dried 80 C; calcined 250/350 C; each calcination 4 h at 4 C/min in clean dry air"
  source: Article [2.1.2]; Performance_Test_Composition_and_CalcTemp_secondgen [all]
  note: >-
    Composition inconsistency: Article 2.1.2 and its sample abbreviation say Cu0.85Al0.15, as
    does the "Al ideal / [1]" column; the deposited sample names and the footnote of Article
    Table 1 say Cu0.85Al0.1. The records follow the method section. "Ga ideal / [1]" = 1 is
    the 1 wt% Ga loading, not a metal fraction.


