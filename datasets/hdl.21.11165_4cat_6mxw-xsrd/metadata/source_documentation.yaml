  value: "OCP: OH -5.35 to 0.79 eV, CO -5.12 to -0.13 eV; MACE: OH -1.50 to 2.91 eV, CO -2.51 to 1.14 eV"
  source: Composition_Screenings.tab [four energy columns, "-" = not computed]
  note: OH sign differs between the models for 13 of the 31 shared materials, CO for 7.


