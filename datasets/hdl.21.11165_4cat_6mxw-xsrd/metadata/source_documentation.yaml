mlip_compositions:
  value: "48 rows = 37 distinct materials; OCP 37, MACE 31 (all 31 also in OCP)"
  source: Composition_Screenings.tab [column Composition]
  note: >-
    11 materials appear twice with the elements in a different order (Fe3Cu/CuFe3, Ga2Cu/CuGa2,
    Ga3Co/CoGa3, Ga4Cu9/Cu9Ga4, GaCu3/Cu3Ga, In3Co/CoIn3, In3Cu7/Cu7In3, In4Ag9/Ag9In4,
    Mn3Co/CoMn3, MnCu3/Cu3Mn, MnGa/GaMn), one row per model. Matched by normalised formula.

