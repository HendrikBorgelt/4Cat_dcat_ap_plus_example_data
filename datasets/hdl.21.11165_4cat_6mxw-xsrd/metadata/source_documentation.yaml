# ============================================================
# 4. SIMULATIONS
# ============================================================

dft_method:
  value: "VASP; PBE; PAW; ASE and pymatgen for structure generation"
  source: vocabulary_map.csv [rows "active_site", "OH", "CO"] for the method; Article [2.3] for code and functional
  note: >-
    The article uses PBE-D3 when verifying the machine-learned potentials (3.1); whether D3
    was applied to Active_Sites_Screening is not stated. Cut-off, k-points and slab models: SI.

dft_sites:
  value: 17 sites, CuGa2O4 (pristine + Al, Co, Cu, Ge, In, Ni, Sn) and Ga2O3 (pristine + Al, Pd, Pt, Rh, Ru, Sn, Zn, Zr)
  source: Active_Sites_Screening [column active_site]

binding_energy_reference:
  value: "CO: E_CO = E_slab+CO - E_slab - E_CO(g); OH: not defined in the main text"
  source: Article [Figure 2 caption]

mlip_models:
  value: "EquiformerV2-31M-S2EF-OC20-All+MD (column 'OCP model'); MACE-MPA-0"
  source: Composition_Screenings [column headers]; Article [Table 2, row "Prescreening and sampling for DFT calculations"]
  note: >-
    The OCP checkpoint is inferred: Table 2 lists exactly these two models for prescreening.
    A second OCP checkpoint (EquiformerV2-lE4-lF100-S2EFS-OC22) is used for surface phase
    diagrams, which are not in the deposit.

mlip_compositions:
  value: "48 rows = 37 distinct materials; OCP 37, MACE 31 (all 31 also in OCP)"
  source: Composition_Screenings [column Composition]
  note: 11 materials appear twice with the elements in a different order (e.g. Ga4Cu9/Cu9Ga4).

mlip_ranges:
  value: "OCP: OH -5.35 to 0.79 eV, CO -5.12 to -0.13 eV; MACE: OH -1.50 to 2.91 eV, CO -2.51 to 1.14 eV"
  source: Composition_Screenings [four energy columns, "-" = not computed]
  note: OH sign differs between the models for 13 of the 31 shared materials, CO for 7.


