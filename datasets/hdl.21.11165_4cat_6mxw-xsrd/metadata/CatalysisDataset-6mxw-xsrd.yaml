is_about_activity:
- id: coremeta4cat:REAC_6mxw-xsrd_CO2_hydrogenation
  reaction_name:
  - hydrogenation of CO2/CO to methanol and dimethyl ether
  title:
  - CO2/CO hydrogenation over Cu-Ga-Al mixed metal oxides (17 conditions, 7 catalysts)
  description:
  - 'Catalytic testing of Cu-Ga-Al mixed metal oxides for the conversion of CO2 to methanol and dimethyl
    ether at 80 bar and 225-300 C. The test protocol varies the feed (CO2 13-27.1 vol%, CO 0-15.8 vol%,
    H2 36.7-76 vol%, 5 vol% Ar in every feed; H2/COx 1.2-4), the temperature (225, 250, 275, 300 C) and
    the gas hourly space velocity (3000 and 6000 h-1) over 17 numbered conditions. Seven catalysts are
    listed as tested: three first-generation Cu0.465Ga0.07Al0.465 oxides calcined at 500, 600 and 700
    C, and four second-generation Cu-Al oxides with 1 wt% Ga (two calcination temperatures for each of
    the two steps).'
  catalyst_type:
  - heterogeneous_catalysis
  used_catalyst:
  - id: coremeta4cat:CAT_6mxw-xsrd_G1_500
    title: Cu0.465Ga0.07Al0.465(500)
