title:
- Copper Gallium Aluminum Mixed Metal Oxides as Alternative Catalyst Candidates for Efficient Conversion
  of Carbon Dioxide to Methanol and Dimethyl Ether
description:
- 'Data from the publication of the same title (ACS Catal., doi:10.1021/acscatal.5c03876): DFT and machine-learned-potential
  (OCP, MACE-MPA-0) binding energies of OH and CO used to screen active phases, nominal and XRF compositions
  of 76 Cu-Ga-Al mixed metal oxides, calcination temperatures of the seven catalysts selected for testing,
  and the 17-condition test protocol for CO2/CO hydrogenation to methanol and dimethyl ether at 80 bar.
  No catalytic performance results are included in the deposit. A further list of 13 nominal compositions
  (Sample_Compositions.tab) has no stated purpose and is not described here.'
