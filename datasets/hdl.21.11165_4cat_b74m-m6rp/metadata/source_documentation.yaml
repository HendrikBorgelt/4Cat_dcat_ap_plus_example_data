# 3. SYNTHESIS

supports:
  value: "tape casting of BCZY811 (CerPoTech) or 8-YSZ (Tosoh), with NiO (J.T. Baker) at NiO:ceramic 60:40 by weight for the cermets, graphite, ethanol, MEK, PVB, PEG, TEG-EH; dried 12 h RT + 10 min 773 K; sintered 9 h at 1673 K; crushed"
  source: Article [2.1]

impregnation:
  value: "stepwise incipient wetness impregnation (100 uL steps, drying 15 min at 348 K) with Ru(III) nitrosyl nitrate solution and Ba(NO3)2 (Alfa Aesar); calcination 5 h at 873 K in static air; granulated to 120-250 um"
  source: Article [2.1]

loadings:
  value: "Ru 0-1.0 wt%, Ba 0-1.0 wt% (nominal)"
  source: Article [Table 1]

precursor_masses:
  value: missing
  note: Mandatory; the article gives a weight ratio and target loadings only. Both Synthesis records stay incomplete.

support_properties:
  value: "BET: NiO-BCZY 1.1 m2/g, YSZ 14.1 m2/g; Ni dispersion of Ni-BCZY 3.17%"
  source: Article [Table 2, 4.1]


# 4. CHARACTERIZATION

tpr:
  value: "H2-TPR of Ni-BCZY, about 0.1 g, RT to 1223 K at 10 K/min in 10% H2/Ar (50 mL/min), TCD"
  source: Fig1 (38-951 C, 954 points); Article [2.2, Fig. 1 caption]
  note: Without the article the technique and the sample were unknown.

other_characterization:
  value: "N2 physisorption (BELSORP Mini II), SEM/EDX (Quanta 250 FEG), H2-TPD for Ni dispersion"
  source: Article [2.2]
  note: Data not deposited (except as numbers quoted in the article); not separate records.


# 5. CATALYTIC REACTION

reactor:
  value: "quartz glass tubular reactor, 0.8 cm ID, 100 cm long; 300 mg catalyst + 700 mg silica (120-250 um); bed about 1.2 cm; quartz wool; Bronkhorst MFCs; type N thermocouples"
  source: Article [2.3]

conditions:
  value: "1 bar; GHSV 50,000 h-1; 500/1000/3000 ppm NH3 in Ar; ramp 473-873 K at 2 K/min; pretreatment 1.5 h at 873 K in 5% H2/Ar, 1 h Ar purge at 473 K"
  source: Article [2.3]; Files Fig2, Fig3 [Tein 200-601 C]

product_identification:
  value: "MKS MG2030 FTIR, continuous effluent analysis"
  source: Article [2.3]

light_off_metrics:
  value: "T10/T50 for all six catalysts"
  source: Article [Table 3]
  note: No field; in the description. Only source for 0.5Ru/0.5Ba/Ni-BCZY, whose deposited curve is unreadable.

