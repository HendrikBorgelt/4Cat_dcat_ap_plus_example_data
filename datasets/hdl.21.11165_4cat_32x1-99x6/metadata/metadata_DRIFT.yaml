id: hdl:21.11165/4cat/32x1-99x6#drift_dataset
title:
  - DRIFTS CO-adsorption data – Pd/Al2O3 and Pd/3P/Al2O3 and Pd/SiO2 and Pd/3P/SiO2
description:
  - >-
    Diffuse Reflectance Infrared Fourier Transform Spectroscopy (DRIFTS) during
    CO adsorption at room temperature for four catalyst samples: Pd/Al2O3,
    Pd/3P/Al2O3, Pd/SiO2, and Pd/3P/SiO2. Data are recorded as time-resolved
    spectra (pseudo-absorbance vs. wavenumber) at multiple time points (0–30 min).
    Pseudo-absorbance was computed as log(1/reflectance) and spectra were baseline
    corrected. Analysis and plotting performed with OriginPro 2023.
    Part of the parent dataset hdl:21.11165/4cat/32x1-99x6.
