id: hdl:21.11165/4cat/32x1-99x6#pxrd_dataset
title:
  - Powder X-ray Diffraction (PXRD) data – Pd/P catalysts on Al2O3 and SiO2 supports
description:
  - >-
    PXRD characterization of 10 Pd-based catalyst samples with varying phosphorus
    loading (0–5 wt%) on Al2O3 and SiO2 supports. Data are provided as two-column
    ASCII files (2θ in degrees / intensity in counts, .xy format). Eight samples
    cover a 2θ range of 2–92° (6000 data points, step 0.015°); two samples
    (Pd5Al2O3, Pd5PSiO2) cover 2–63.5° (4098 data points). Part of the parent
    dataset hdl:21.11165/4cat/32x1-99x6.
rdf_type:
  id: VOC4CAT:0007001
  title: heterogeneous catalysis
