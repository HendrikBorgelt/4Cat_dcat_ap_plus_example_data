# 4. CHARACTERIZATION TECHNIQUE PARAMETERS
# ============================================================

characterization:

  # --- PXRD ---
  PXRD:
    rdf_type:
      value: CHMO:0000158 (powder X-ray diffraction)
      source: Schema (coremeta4cat_characterization_ap.yaml, PowderXRD class_uri)
    minimum_2theta:
      value: 2.0 degrees
      source: PXRD_PdAl2O3.xy [line 1, column 1: "2.00000"]
    maximum_2theta:
      value: ~91.97 degrees (full-range files)
      source: PXRD_PdAl2O3.xy [line 5999, column 1: "91.97000"]
    step_size:
      value: 0.015 degrees
      source: PXRD_PdAl2O3.xy [lines 1–2: 2.00000 → 2.01500; difference = 0.015]
    data_points_full:
      value: 6000 (lines 1–6000)
      source: PXRD_PdAl2O3.xy [verified by line count]
      note: Applies to PXRD_PdAl2O3.xy, PdSiO2, Pd1P, Pd2P, Pd3P, Pd4PAl2O3, Pd3PSiO2, 1PSiO2
    data_points_short:
      value: 4098 (lines 1–4098); 2θ range 2.0–63.5°
      source: File sizes in MANIFEST.TXT; PXRD_Pd5Al2O3.xy and PXRD_Pd5PSiO2.xy
    file_format:
      value: Two-column ASCII (2θ degrees TAB intensity counts)
      source: PXRD_PdAl2O3.xy [lines 1–5: "2.00000\t17207.000"]
    instrument:
      value: X-ray diffractometer (model not specified)
      source: Not stated in any dataset file.

  # --- DRIFT SPECTROSCOPY ---
  DRIFT:
    rdf_type:
      value: CHMO:0000645 (diffuse reflectance infrared Fourier transform spectroscopy)
      source: Schema (coremeta4cat_characterization_ap.yaml, DRIFTS class_uri)
    adsorption_gas:
      value: CO
      source: File names (DRIFT_Pd_Al2O3_CO_Ads_RT.dat etc.); "CO_Ads" in filename
    atmosphere:
      value: CO at room temperature
      source: File names: "CO_Ads_RT" suffix
    data_conversion:
      value: pseudo-absorbance = log(1/reflectance)
      source: info_drifts.txt [line 3]
    reference_doi:
      value: DOI 10.1021/ac0702802 (Anal. Chem. 2007, 79, 10, 3912–3918)
      source: info_drifts.txt [line 2]
    baseline_correction:
      value: Applied (for stacked spectra display)
      source: info_drifts.txt [line 4]
    analysis_software:
      value: OriginPro 2023
      source: info_drifts.txt [line 4]
    samples_measured:
      value: [Pd/Al2O3, Pd/3P/Al2O3, Pd/SiO2, Pd/3P/SiO2]
      source: File names of the four DRIFT .dat files
    instrument:
      value: FTIR spectrometer with DRIFT accessory (model not specified)
      source: Not stated in any dataset file.

  # --- INFRARED SPECTROSCOPY ---
  IR:
    rdf_type:
      value: coremeta4cat:InfraredSpectroscopy
      source: Schema (coremeta4cat_characterization_ap.yaml, InfraredSpectroscopy class_uri)
    minimum_wavenumber:
      value: ~400 cm⁻¹
      source: IR_2Pd1PAl2O3.0.dpt [line 3318: "400.18013\t0.05735"]
    maximum_wavenumber:
      value: ~3599 cm⁻¹
      source: IR_2Pd1PAl2O3.0.dpt [line 1: "3598.72831\t0.00973"]
    data_points:
      value: 3319 per file
      source: IR_2Pd1PAl2O3.0.dpt [verified by line count]
    file_format:
      value: Two-column ASCII (wavenumber cm⁻¹ TAB pseudo-absorbance)
      source: IR_2Pd1PAl2O3.0.dpt [lines 1–3: "3598.72831\t0.00973"]
    samples_measured:
      value: [2Pd/1P/Al2O3, 2Pd/3P/Al2O3, 2Pd/5P/Al2O3, 2Pd/1P/SiO2, 2Pd/3P/SiO2, 2Pd/5P/SiO2]
      source: File names of the six IR .dpt files
    instrument:
      value: FTIR spectrometer (model not specified)
      source: Not stated in any dataset file.

  # --- BET ---
  BET:
    rdf_type:
      value: coremeta4cat:BET (Brunauer-Emmett-Teller analysis)
      source: Schema (coremeta4cat_characterization_ap.yaml, BET class_uri)
    adsorbate_gas:
      value: N2 (assumed standard; not explicitly stated)
      source: Not explicitly stated in bet_results.txt. Convention for BET is N2 at -196°C.
    measurement_temperature:
      value: -196°C (assumed liquid nitrogen; not explicitly stated)
      source: Not explicitly stated; standard BET convention.
    result_unit:
      value: m²/g
      source: bet_results.txt [line 1: "Catalyst - surface area m^2/g"]
    instrument:
      value: BET surface area analyser (model not specified)
      source: Not stated in any dataset file.

  # --- ICP-AES ---
  ICP-AES:
    rdf_type:
      value: CHMO:0000267 (inductively coupled plasma atomic emission spectroscopy)
      source: Schema (coremeta4cat_characterization_ap.yaml, ICPAES class_uri)
    elements_analyzed:
      value: [Pd, P]
      source: icp_results.txt [line 1 header format + column values for Pd and P wt%]
    result_unit:
      value: wt%
      source: icp_results.txt [line 1: "… wt% Pd; … wt% P"]
    instrument:
      value: ICP-AES spectrometer (model not specified)
      source: Not stated in any dataset file.

  # --- TEM (Transmission Electron Microscopy) ---
  TEM:
    note: >-
      TEM is mentioned in the dataset description ("PXRD, DRIFT, IR, BET, and TEM")
      but NO TEM data files are present in the deposited dataset.
    source_of_mention: export.customization [line 1 | $.datasetVersion.metadataBlocks.citation.fields[3].value[0].dsDescriptionValue.value]


# ============================================================
# 5. REACTION CONDITIONS (catalytic_data.xlsx)
# ============================================================

reaction:

  substrates:
    cinnamyl_alcohol:
      value: CAL (cinnamyl alcohol)
      source: catalytic_data.xlsx [Sheet 1 "Initial Experiments", column header row; Sheets 2–3 tab names contain "CAL"]
    citral:
      value: Citral
      source: catalytic_data.xlsx [Sheets 4–5 tab names: "Pd-XPAl2O3_FF_Citral", "Pd-XPSiO2_FF_Citral"]

  initial_screening_conditions:
    temperature:
      value: 50°C
      source: catalytic_data.xlsx [Sheet 1 "Initial Experiments", row 2 — fixed condition stated in header]
    pressure:
      value: 5 bar
      source: catalytic_data.xlsx [Sheet 1 "Initial Experiments", row 2 — fixed condition stated in header]
    reaction_time:
      value: 30 min
      source: catalytic_data.xlsx [Sheet 1 "Initial Experiments", row 2 — fixed condition stated in header]

  optimisation_factor_ranges:
    temperature:
      value: 30–70°C (coded -2 to +2)
      source: catalytic_data.xlsx [Sheet 2 "Pd-XPAl2O3_CCD_CAL", Temperature column; coded range -2 to +2]
    pressure:
      value: 1–9 bar (coded -2 to +2)
      source: catalytic_data.xlsx [Sheet 2 "Pd-XPAl2O3_CCD_CAL", Pressure column]
    phosphorus_loading:
      value: 1–5 wt% (coded -2 to +2)
      source: catalytic_data.xlsx [Sheet 2 "Pd-XPAl2O3_CCD_CAL", P-loading column]
    reaction_time:
      value: 10–50 min (coded -2 to +2)
      source: catalytic_data.xlsx [Sheet 2 "Pd-XPAl2O3_CCD_CAL", Time column]

  experimental_designs:
    ccd_Al2O3_CAL:
      value: Central Composite Design, 27 runs
      source: catalytic_data.xlsx [Sheet 2 "Pd-XPAl2O3_CCD_CAL", 27 data rows]
    factorial_SiO2_CAL:
      value: Full factorial design, 9 runs
      source: catalytic_data.xlsx [Sheet 3 "Pd-XPSiO2_FF_CAL", 9 data rows]
    factorial_Al2O3_citral:
      value: Full factorial design, 9 runs
      source: catalytic_data.xlsx [Sheet 4 "Pd-XPAl2O3_FF_Citral", 9 data rows]
    factorial_SiO2_citral:
      value: Full factorial design, 9 runs
      source: catalytic_data.xlsx [Sheet 5 "Pd-XPSiO2_FF_Citral", 9 data rows]

  response_variables:
    conversion:
      value: Conversion (%)
      source: catalytic_data.xlsx [Sheet 2, column "Conversion" with standard deviations]
    yield:
      value: Yield (%)
      source: catalytic_data.xlsx [Sheet 2, column "Yield" with standard deviations]

  reactor_type:
    value: Batch pressurised reactor (autoclave or similar)
    source: >-
      Inferred from: (1) 5 bar working pressure (Sheet 1); (2) filtration test
      control entry in Sheet 1; (3) reaction time of 30 min suggests batch mode.
      No explicit reactor model stated in any dataset file.

  product_identification_method:
    value: GC-based (inferred; not explicitly stated)
    source: >-
      Inferred from catalytic_data.xlsx reporting conversion/yield values.
      No explicit analytical instrument stated. GC is the standard method for
      this class of reaction (cinnamyl alcohol/citral hydrogenation).


