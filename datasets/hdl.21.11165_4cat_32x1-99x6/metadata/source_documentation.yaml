# ============================================================

inferred_values:
  - field: rdf_type (CatalysisDataset)
    value: VOC4CAT:0007001 (heterogeneous catalysis)
    basis: Subject fields "Chemistry" and "Engineering" + dataset content

  - field: adsorbate_gas (BET)
    value: N2
    basis: Standard BET convention; not stated in dataset files

  - field: measurement_temperature (BET)
    value: -196°C
    basis: Standard N2 BET at liquid nitrogen temperature; not stated in dataset files

  - field: atmosphere (Reaction)
    value: H2
    basis: Reaction is "hydrogenation"; H2 atmosphere is required but not explicitly stated

  - field: reactor type
    value: Batch autoclave (pressurised vessel)
    basis: Reaction conditions (5 bar, 30 min), presence of "filtration test" in Sheet 1

  - field: product_identification_method
    value: GC-based quantification
    basis: Conversion/yield data reported; GC is standard for this reaction class

  - field: PXRD sample Pd5Al2O3 interpretation
    value: Interpreted as Pd/5P/Al2O3 (same as FR507 in ICP)
    basis: >-
      File is PXRD_Pd5Al2O3.xy but the series context (1P, 2P, 3P, 4P, then
      5P) and ICP data for FR507 (2Pd5PAl2O3) strongly suggest this is the
      5 wt% P variant. The missing "P" in the filename appears to be a typo.

  - field: IR data format (pseudo-absorbance)
    value: Same as DRIFT (log(1/reflectance))
    basis: >-
      info_drifts.txt describes pseudo-absorbance conversion for DRIFT data;
      IR .dpt files use the same pseudo-absorbance column label and similar
      value ranges, consistent with the same convention.
