id: hdl:21.11165/4cat/32x1-99x6
title:
  - >-
    Data set for publication: Support Engineering with Phosphorus: Tuning the
    Palladium-Catalyzed Selective Hydrogenation of α,β-Unsaturated Aldehydes
description:
  - >-
    Dataset consisting of catalyst characterization data (PXRD, DRIFT, IR, BET,
    and TEM) and catalyst testing data for Pd-based catalysts with varying
    phosphorus loading (0–5 wt%) on Al2O3 and SiO2 supports. The catalysts were
    evaluated for the selective hydrogenation of α,β-unsaturated aldehydes
    (cinnamyl alcohol and citral).
