is_about_activity:
  - id: hdl:21.11165/4cat/32x1-99x6#hydrogenation_reaction
    title:
      - Pd-catalysed selective hydrogenation of α,β-unsaturated aldehydes
    description:
      - >-
        Selective hydrogenation of cinnamyl alcohol (CAL) and citral over
        Pd/P catalysts on Al2O3 and SiO2 supports. Target: C=C reduction to
        saturated alcohol. Batch reactor (pressurised vessel).
        Experimental designs: CCD and full-factorial (catalytic_data.xlsx, /9).
    reactant:
      - cinnamyl alcohol (CAL)
      - citral
    catalyst_type: Pd/P on Al2O3 or SiO2, ~2 wt% Pd, 0–5 wt% P
    reactor_temperature_range: 30–70°C
    experiment_pressure: 5.0   # bar; screening conditions (Sheet 1); range 1–9 bar in optimisation
    experiment_duration: 0.5   # hours (30 min); screening; range 10–50 min in optimisation
    atmosphere:
      - H2
    carried_out_by:
      - id: hdl:21.11165/4cat/32x1-99x6#autoclave_reactor
        title: Batch autoclave reactor
        description: Pressurised batch reactor; specific model not stated in dataset files.
    had_input_entity:
      - id: hdl:21.11165/4cat/32x1-99x6#reactant_CAL
        title: Cinnamyl alcohol (CAL)
        rdf_type:
          id: CHEBI:15554
          title: cinnamyl alcohol
      - id: hdl:21.11165/4cat/32x1-99x6#reactant_citral
        title: Citral
        rdf_type:
          id: CHEBI:29085
          title: citral
    product_identification_method:
      - id: hdl:21.11165/4cat/32x1-99x6#product_analysis_method
        title: GC-based product quantification
        description: >-
          Conversion and yield (%) with standard deviations reported in
