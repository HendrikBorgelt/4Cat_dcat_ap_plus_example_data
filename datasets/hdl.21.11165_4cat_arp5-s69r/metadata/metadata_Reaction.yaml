id: hdl:21.11165/4cat/arp5-s69r#reaction_dataset
title:
  - Catalytic carbonylation testing data – Pd3P/SiO2 and Pd/SiO2 (31 experiments)
description:
  - >-
    Catalytic performance data for Pd-catalysed carbonylation reactions
    (carbonylation, phenoxycarbonylation, aminocarbonylation) using Pd3P/SiO2
    (ARNE01, 5 wt% Pd) and Pd/SiO2 (ARNE02, 5 wt% Pd) catalysts. 31 batch
    experiments in a Parr 5500 compact reactor (25 mL SS, overhead stirrer
    1000 rpm). Primary substrate: iodobenzene (1 mmol, 204 mg). CO atmosphere
    (6 bar, or 10 bar for some aminocarbonylation). Catalyst mass: 10 mg.
    Response variables: reactant conversion and product yield (GC-MS, n-decane
    internal standard 2.2 vol%). Five experimental series:
    A (kinetics, 100°C), B (conditions scope, 100°C), C (Pd reference, 100°C),
    k (temperature series, 60–80°C), S (substrate scope + reaction type scope).
    Source: Cat test json_outputs/*.json and Overview Reaction Description-2.txt.
rdf_type:
  id: VOC4CAT:0007001
  title: heterogeneous catalysis
other_identifier:
  - notation: https://hdl.handle.net/21.11165/4cat/arp5-s69r
theme:
  - preferred_label:
      - Chemistry
      - Engineering

