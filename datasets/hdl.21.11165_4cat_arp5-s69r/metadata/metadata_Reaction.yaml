# ---------- CATALYTIC REACTIONS BEING STUDIED ----------

is_about_activity:
  - id: hdl:21.11165/4cat/arp5-s69r#carbonylation_reaction
    title:
      - Pd-catalysed carbonylation of aryl iodides with CO insertion
    description:
      - >-
        Palladium-catalysed carbonylation reactions (CO insertion) of aryl iodides
        (primarily iodobenzene) with various nucleophiles (alcohols, phenols, amines)
        under CO atmosphere. Three reaction types: (1) alkoxycarbonylation
        (iodobenzene + alcohol + CO → ester), (2) phenoxycarbonylation
        (iodobenzene + phenol + CO → aryl ester), (3) aminocarbonylation
        (iodobenzene + amine + CO → amide). Catalyst: Pd3P/SiO2 (ARNE01) vs
        Pd/SiO2 (ARNE02). Parr 5500 batch reactor, 6–10 bar CO, 60–140°C.
    rdf_type:
      id: VOC4CAT:0007001
      title: heterogeneous catalysis
    carried_out_by:
      - id: hdl:21.11165/4cat/arp5-s69r#parr5500_reactor
        title: Parr 5500 series compact reactor
        description: >-
          25 mL stainless steel cylindrical reactor (ID 25.4 mm, length 50.8 mm).
          Overhead stirrer (1000 rpm), electric heating. Parr Instrument Company.
    had_input_entity:
      - id: hdl:21.11165/4cat/arp5-s69r#reactant_iodobenzene
        title: Iodobenzene
        rdf_type:
          id: CHEBI:35640
          title: iodobenzene
      - id: hdl:21.11165/4cat/arp5-s69r#reactant_CO
        title: Carbon monoxide (CO, carbonylating agent)
        rdf_type:
          id: CHEBI:17245
          title: carbon monoxide
    product_identification_method:
      - title: GC-MS with n-decane internal standard
        description: >-
          Liquid-phase product analysis by gas chromatography-mass spectrometry
          (GC-MS). Internal standard: n-decane (2.2 vol%). Conversion and yield
          as dimensionless fractions (0–1) reported in individual JSON files.

