title:
  - Powder X-ray diffraction data – Pd/SiO2 and Pd3P/SiO2 catalysts
description:
  - >-
    Powder X-ray diffraction (PXRD) for phase identification and structural
    characterisation of Pd-based catalysts. Three two-column ASCII data files
    (2θ [°] / intensity counts) measured on a Stoe STADI-MP diffractometer
    with Cu Kα radiation (λ = 1.54178 Å), transmission geometry, Ge
    monochromator, 2θ range 2–90°, measurement duration 80 min.
    Samples: ARNE02 (Pd/SiO2), ARNE01 (Pd3P/SiO2, 5 wt% Pd), and a
    Pd3P/SiO2 lower-loading reference. Phase identification references:
    Pd (ICSD 52251), Pd3P (ICSD 85525).
