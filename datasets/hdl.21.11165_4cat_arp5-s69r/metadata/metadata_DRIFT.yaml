id: hdl:21.11165/4cat/arp5-s69r#drift_dataset
title:
  - DRIFTS CO-adsorption data -- Pd/SiO2 and Pd3P/SiO2 at 30 degC and 100 degC (4 spectra series)
description:
  - >-
    In-situ DRIFTS of CO adsorption (4000 ppm CO in Ar) over Pd/SiO2 (ARNE02)
    and Pd3P/SiO2 (ARNE01) at two temperatures (30 degC and 100 degC). Time-resolved
    reflectance spectra (40 time steps per file) recorded during CO adsorption.
    Instrument: Bruker VERTEX 70 FTIR spectrometer with Harrick Praying Mantis
    diffuse reflectance accessory and LN-MCT Mid VP detector. In-situ cell:
    Harrick with CaF2 window. Data mode: reflectance (raw). Gas flow: 50 mL/min
    (4000 ppm CO in Ar); Ar flush prior to measurement.
    Sample: 50 mg, 100-200 um sieve fraction.
