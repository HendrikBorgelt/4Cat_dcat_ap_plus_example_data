id: hdl:21.11165/4cat/arp5-s69r
title:
  - >-
    Data set for publication: Sustainable carbonylation catalysis of renewable
    synthons through active-site engineering
description:
  - >-
    Dataset for Pd3P/SiO2 and Pd/SiO2 catalysts used in carbonylation reactions.
    Characterisation: PXRD (phase identification), in-situ DRIFTS (CO adsorption),
    CO chemisorption (active site quantification), XPS (surface electronic state),
    and STEM/TEM (particle size and morphology). Catalytic testing: 31 batch
    reactor experiments covering alkoxycarbonylation, phenoxycarbonylation, and
    aminocarbonylation of aryl iodides. Reactor: Parr 5500 compact reactor (25 mL).
    Active catalyst (ARNE01): Pd3P/SiO2 (5 wt% Pd). Reference (ARNE02): Pd/SiO2.
