title:
- 'Datasets for Publication: Navigating the Sequence-Function Landscape: AI-Driven Discovery of Unseen
  and SynergisticMutations in an Amine Transaminase - Molecular Dynamic Simulations'
description:
- 'Computational part of a study on AI-guided engineering of an amine transaminase: protein preparation
  of the variant 3FCR-4M, induced-fit docking of the ligand-cofactor complex, Desmond molecular dynamics
  (setup, minimisation, equilibration, production) of the complex in 3FCR-4M and the mutants S19V/P423F
  and G151A/P423F, and Prime MM/GBSA binding free energies. All results are in 17 software archives (about
  33 GB); a README gives the authors and abstract of the publication.'
