# 2. ENTITIES

structure:
  value: 3FCR-4M
  source: file names (3FCR4M); file descriptions say "3CFR-4M"
  note: >-
    The two spellings disagree. 3FCR is used because it appears in all file names. "4M" is read
    as four mutations; which ones is not stated. A structure identifier slot (PDB) would make
    this checkable (B1).

mutants:
  value: "M1 = 3FCR-4M-S19V/P423F, M2 = 3FCR-4M-G151A/P423F"
  source: API file descriptions of the *_M1* and *_M2* archives

ligand:
  value: CPEA
  source: file name InducedFit_3FCR4M_CPEA.tar.gz
  note: >-
    Not resolved in the deposit. The abstract names (S)-1-(2-chlorophenyl)ethanamine as a
    product, which may be what CPEA stands for; not confirmed.

cofactor:
  value: not named
  source: file descriptions ("ligand-cofactor complex")
  note: Amine transaminases use pyridoxal 5'-phosphate; the deposit does not say so.


