id: hdl:21.11165/4cat/2d6m-exeb#reaction_dataset
title:
  - CO methanation kinetics data – Ni/Al₂O₃ fixed-bed reactor experiments
description:
  - >-
    Steady-state CO methanation kinetics data measured in an isothermal fixed-bed
    reactor over a 20 wt% Ni/Al₂O₃ catalyst. The dataset contains 19 experimental
    runs (Exp2–Exp20; Exp1, 6, 10 excluded for confidentiality). Each run is stored
    as a two-file pair: a CSV with columns (u, T, CO) representing superficial
    velocity [m/s], temperature [K], and CO conversion (dimensionless 0–1), and a
    JSON file with experiment-level metadata. Feed composition: H₂:CO:Ar = 0.6:0.2:0.2
    (molar fractions), total pressure 100 kPa. Reactor is a cylindrical isothermal
    fixed-bed (radius r = 0.008 m). Particle diameter: 630 µm. Related publication:
    DOI 10.1021/acs.iecr.1c00389.
rdf_type:
  id: VOC4CAT:0007001
  title: heterogeneous catalysis
